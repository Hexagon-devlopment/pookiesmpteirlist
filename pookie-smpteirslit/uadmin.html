<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PookieSMP Admin</title>

<style>
body{
background:#0b0b12;
color:white;
font-family:Arial;
text-align:center;
}

.box{
margin-top:80px;
}

input{
padding:12px;
margin:10px;
border:none;
border-radius:10px;
width:220px;
}

button{
padding:12px 20px;
border:none;
border-radius:10px;
background:#ff4fb3;
color:white;
cursor:pointer;
}

.hidden{
display:none;
}

.preview{
margin-top:20px;
}

img{
border-radius:10px;
}

.playerCard{
margin:10px;
background:#151521;
padding:10px;
border-radius:10px;
}
</style>

</head>

<body>

<!-- 🔒 LOGIN -->
<div class="box" id="loginBox">
<h2>🔒 Admin Login</h2>
<input type="password" id="pass" placeholder="Enter Password">
<br>
<button onclick="login()">Login</button>
</div>

<!-- ⚡ PANEL -->
<div class="box hidden" id="panel">

<h2>⚡ Admin Panel</h2>

<input id="name" placeholder="Player IGN" oninput="previewSkin()">
<br>

<input id="region" placeholder="Region (NA/EU/AS)">
<input id="overall" placeholder="Overall (HT1)">
<input id="sword" placeholder="Sword">
<input id="crystal" placeholder="Crystal">

<br>

<button onclick="addPlayer()">Add Player</button>

<!-- 👀 SKIN PREVIEW -->
<div class="preview">
<img id="skinPreview" src="" width="80">
</div>

<!-- 📋 PLAYER LIST -->
<h3>Players</h3>
<div id="playerList"></div>

</div>

<script>

const SECRET = "pookie123";

// 🔒 login
function login(){
let p = document.getElementById("pass").value;

if(p === SECRET){
document.getElementById("loginBox").classList.add("hidden");
document.getElementById("panel").classList.remove("hidden");
loadPlayers(); // load list after login
}else{
alert("Wrong password");
}
}

// 👀 preview skin
function previewSkin(){
let ign = document.getElementById("name").value;
document.getElementById("skinPreview").src =
`https://mc-heads.net/avatar/${ign}`;
}

// 💾 add player
function addPlayer(){

let ign = document.getElementById("name").value;

if(!ign){
alert("Enter IGN ❌");
return;
}

let player = {
name: ign,
skin: `https://mc-heads.net/avatar/${ign}`,
region: document.getElementById("region").value,
overall: document.getElementById("overall").value,
sword: document.getElementById("sword").value,
crystal: document.getElementById("crystal").value
};

let players = JSON.parse(localStorage.getItem("players") || "[]");

players.push(player);

localStorage.setItem("players", JSON.stringify(players));

alert("Player Added ✅");

// clear inputs
document.getElementById("name").value = "";
document.getElementById("region").value = "";
document.getElementById("overall").value = "";
document.getElementById("sword").value = "";
document.getElementById("crystal").value = "";
document.getElementById("skinPreview").src = "";

loadPlayers(); // refresh list
}

// 📋 load players
function loadPlayers(){

let players = JSON.parse(localStorage.getItem("players") || "[]");

let box = document.getElementById("playerList");

box.innerHTML = "";

players.forEach((p,i)=>{

box.innerHTML += `
<div class="playerCard">
${p.name} (${p.overall})
<br>
<button onclick="deletePlayer(${i})">❌ Delete</button>
</div>
`;

});

}

// ❌ delete player
function deletePlayer(index){

let players = JSON.parse(localStorage.getItem("players") || "[]");

players.splice(index,1);

localStorage.setItem("players", JSON.stringify(players));

loadPlayers();

}

</script>

</body>
</html>
